    <!-- Preload the LCP hero on the most-trafficked landing (/) so the
         browser starts fetching it before parsing the JS bundle. Safe to
         leave even when visitors land on other routes — same image is
         widely reused and the cache hit pays off. -->
    <link rel="preload" as="image" href="/images/hero-section.jpg" fetchpriority="high" />

    <!-- SVG favicon with embedded prefers-color-scheme adapts in browsers that ignore the media attribute on icon links (Arc, Brave, etc.) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallbacks for browsers without SVG favicon support -->
    <link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon-light.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "@id": "https://places-egy.com/#organization",
      "name": "PLACES",
      "url": "https://places-egy.com",

        "https://www.instagram.com/places.egy",
        "https://www.facebook.com/share/1CMGKrymLB/",
        "https://www.linkedin.com/company/places-egy/",
        "https://www.tiktok.com/@places.eg"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://places-egy.com/#website",
      "name": "PLACES",
      "url": "https://places-egy.com/",
      "publisher": { "@id": "https://places-egy.com/#organization" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://places-egy.com/listings?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Google Analytics 4 with Consent Mode v2 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V2FVS9XZ5D"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Default: deny everything until user consents (EU compliance)
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });

      // Restore stored consent if user already chose
      try {
        var saved = localStorage.getItem('cookie_consent');
        if (saved === 'accepted') {
          gtag('consent', 'update', {
            ad_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted',
            analytics_storage: 'granted'
          });
        }
      } catch (e) {}

      gtag('js', new Date());
      gtag('config', 'G-V2FVS9XZ5D', { send_page_view: false });
    </script>

    <!-- Microsoft Clarity — session recordings, heatmaps, click tracking.
         Only loads after the user accepts cookies (respects the same
         cookie_consent localStorage flag GA4 uses). CookieBanner.tsx also
         re-checks on accept and loads Clarity live at that moment so a
         first-visit accept starts recording immediately without a reload.

         Replace CLARITY_PROJECT_ID below with the actual project ID from
         clarity.microsoft.com. Leave as null to disable Clarity entirely
         until an ID is provided. -->
    <script>
      window.__CLARITY_PROJECT_ID = "xqobhahxp3";

      window.__loadClarity = function () {
        if (!window.__CLARITY_PROJECT_ID) return;
        if (window.clarity) return; // already loaded
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", window.__CLARITY_PROJECT_ID);
      };

      // Load Clarity now if the user already consented in a prior session.
      try {
        if (localStorage.getItem('cookie_consent') === 'accepted') {
          window.__loadClarity();
        }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
